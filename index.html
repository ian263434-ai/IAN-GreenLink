<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071c14">
<meta name="description" content="IAN GreenLink - Connect. Act. Go Green.">
<title>IAN GreenLink | Connect. Act. Go Green.</title>

<style>
:root{
--g:#18a957;
--g2:#08783c;
--dark:#071c14;
--ink:#10221b;
--muted:#65756e;
--soft:#e8f8ef;
--line:#dce9e2;
--bg:#f8fcf9;
--w:#fff;
--shadow:0 18px 50px #0a321e12;
--r:26px
}

*{
box-sizing:border-box;
scroll-behavior:smooth
}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
line-height:1.6
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer
}

/* TOP BAR */
.top{
height:4px;
background:linear-gradient(
90deg,
#08783c,
#18a957,
#83dfa9,
#18a957,
#08783c
)
}

/* NAVIGATION */
header{
position:sticky;
top:0;
z-index:20;
background:#fffffff2;
backdrop-filter:blur(16px);
border-bottom:1px solid var(--line)
}

.container{
width:min(1150px,92%);
margin:auto
}

.nav{
height:76px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
align-items:center;
gap:10px;
border:0;
background:0;
font-weight:900;
font-size:21px;
color:var(--ink)
}

.brand span span{
color:var(--g)
}

.logo{
width:45px;
height:45px;
border-radius:14px;
background:var(--soft);
display:grid;
place-items:center;
font-size:25px
}

.links{
display:flex;
gap:2px
}

.links button,
.mobile button{
border:0;
background:0;
padding:10px 11px;
border-radius:12px;
font-weight:750;
color:#44534d
}

.links button:hover,
.mobile button:hover{
background:var(--soft);
color:var(--g2)
}

.hamb{
display:none;
border:0;
background:0;
font-size:30px
}

.mobile{
padding:10px 0 18px;
border-top:1px solid var(--line)
}

.mobile button{
display:block;
width:100%;
text-align:left
}

.hide{
display:none!important
}

/* HERO */
.hero{
padding:95px 0 80px;
background:
radial-gradient(
circle at 78% 20%,
#c9f5d9,
#eaf9ef 25%,
#f8fcf9 62%,
#fff
);
overflow:hidden
}

.badge,
.kicker{
color:var(--g2);
font-weight:900
}

.badge{
display:inline-block;
padding:10px 18px;
background:#def5e7;
border-radius:99px;
margin-bottom:20px
}

.hero h1{
font-size:clamp(48px,8vw,90px);
line-height:.95;
letter-spacing:-4px;
max-width:900px;
margin:0 0 25px;
font-weight:950
}

.hero h1 span,
h2 span{
color:var(--g)
}

.hero p{
max-width:730px;
color:var(--muted);
font-size:20px;
margin:0 0 30px
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:16px;
padding:14px 22px;
font-weight:850;
transition:.2s
}

.btn:hover{
transform:translateY(-2px)
}

.primary{
background:var(--g);
color:#fff;
box-shadow:0 12px 28px #18a95735
}

.secondary{
background:#fff;
color:var(--g2);
border:1px solid var(--line)
}

.dark{
background:var(--dark);
color:#fff
}

/* SECTIONS */
.section{
padding:75px 0
}

.head{
margin-bottom:28px
}

.kicker{
text-transform:uppercase;
letter-spacing:1.5px;
font-size:13px
}

h2{
font-size:clamp(34px,5vw,55px);
line-height:1.02;
letter-spacing:-2px;
margin:7px 0
}

.lead{
color:var(--muted);
max-width:720px;
font-size:17px
}

.grid{
display:grid;
gap:20px
}

.g3{
grid-template-columns:repeat(3,1fr)
}

.g4{
grid-template-columns:repeat(4,1fr)
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:var(--r);
padding:24px;
box-shadow:var(--shadow)
}

.card h3{
margin:10px 0 7px;
font-size:20px
}

.card p{
color:var(--muted);
margin:0
}

.icon{
width:56px;
height:56px;
border-radius:18px;
background:var(--soft);
display:grid;
place-items:center;
font-size:28px
}

/* STATISTICS */
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-top:20px
}

.stat{
background:#fff;
border:1px solid var(--line);
border-radius:22px;
padding:22px
}

.stat strong{
font-size:38px;
color:var(--g2);
display:block
}

.stat small{
font-weight:750;
color:var(--muted)
}

/* DARK PANEL */
.panel{
background:var(--dark);
color:#fff;
border-radius:32px;
padding:35px
}

.panel p{
color:#a9bbb3
}

/* SEARCH */
.search{
max-width:700px;
margin:0 auto 20px;
position:relative
}

.search input{
padding:17px 18px 17px 50px;
border-radius:20px;
box-shadow:var(--shadow)
}

.search b{
position:absolute;
left:18px;
top:11px;
font-size:23px
}

.filters{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:28px
}

.filter{
border:0;
background:#edf2ef;
padding:10px 17px;
border-radius:99px;
font-weight:850
}

.filter.active{
background:var(--g);
color:#fff
}

/* TAGS */
.tag{
display:inline-block;
padding:4px 10px;
border-radius:99px;
font-size:12px;
font-weight:900
}

.rec{
background:#dff7e8;
color:#08783c
}

.special{
background:#fff1c9;
color:#815f00
}

.avoid{
background:#ffe2e2;
color:#a32929
}

/* FORMS */
.form{
display:grid;
gap:14px
}

label{
font-weight:800
}

input,
select,
textarea{
width:100%;
padding:14px 16px;
border:1px solid #d6e3dd;
border-radius:15px;
outline:0;
background:#fff
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--g);
box-shadow:0 0 0 4px #18a95718
}

textarea{
min-height:120px;
resize:vertical
}

/* TABLE */
.tablewrap{
overflow:auto;
border:1px solid var(--line);
border-radius:20px;
background:#fff
}

table{
width:100%;
border-collapse:collapse;
min-width:650px
}

th,
td{
text-align:left;
padding:13px 15px;
border-bottom:1px solid #e4eee8
}

th{
background:#eff9f3;
color:#176c40
}

td{
color:#52615b
}

.pill{
padding:4px 9px;
border-radius:99px;
background:var(--soft);
color:var(--g2);
font-size:12px;
font-weight:900
}

/* NOTICE */
.notice{
display:flex;
gap:15px;
background:#fff;
border:1px solid var(--line);
border-left:5px solid var(--g);
border-radius:15px;
padding:18px
}

/* ABOUT */
.about{
display:grid;
grid-template-columns:1fr 1.2fr;
gap:28px;
align-items:center
}

.avatar{
width:180px;
height:180px;
border-radius:50%;
margin:auto;
background:
radial-gradient(
circle at 35% 25%,
#43d47c,
#07843e 60%,
#055c2d
);
display:grid;
place-items:center;
color:#fff;
font-size:80px;
font-weight:950;
box-shadow:0 20px 50px #006e3728
}

.quote{
font-size:25px;
font-weight:850;
line-height:1.25
}

/* FOOTER */
footer{
background:var(--dark);
color:#fff;
padding:60px 0 28px
}

.foot{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr;
gap:30px
}

.foot p,
.foot button{
color:#8ea49a
}

.foot button{
display:block;
background:0;
border:0;
padding:6px 0;
text-align:left
}

.foot button:hover{
color:#fff
}

.bottom{
border-top:1px solid #1d3a2f;
margin-top:40px;
padding-top:20px;
color:#728980;
display:flex;
justify-content:space-between;
flex-wrap:wrap
}

/* TOAST */
.toast{
position:fixed;
right:18px;
bottom:18px;
background:var(--dark);
color:#fff;
padding:13px 17px;
border-radius:14px;
transform:translateY(120px);
transition:.3s;
z-index:80
}

.toast.show{
transform:none
}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:#0009;
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:70
}

.modal.open{
display:flex
}

.modalbox{
background:#fff;
width:min(520px,100%);
border-radius:26px;
padding:28px;
position:relative
}

.close{
position:absolute;
right:15px;
top:12px;
border:0;
background:#edf2ef;
border-radius:50%;
width:36px;
height:36px;
font-size:20px
}

/* RESPONSIVE */
@media(max-width:900px){

.links{
display:none
}

.hamb{
display:block
}

.g4{
grid-template-columns:repeat(2,1fr)
}

.foot{
grid-template-columns:repeat(2,1fr)
}

.about{
grid-template-columns:1fr
}

}

@media(max-width:620px){

.nav{
height:68px
}

.brand{
font-size:18px
}

.logo{
width:40px;
height:40px
}

.hero{
padding:65px 0
}

.hero h1{
font-size:53px;
letter-spacing:-2.5px
}

.hero p{
font-size:17px
}

.section{
padding:55px 0
}

.g3,
.g4,
.stats{
grid-template-columns:1fr
}

.foot{
grid-template-columns:1fr
}

.actions .btn{
width:100%
}

.panel{
padding:25px;
border-radius:25px
}

}
</style>
</head>

<body>

<div class="top"></div>

<header>

<div class="container nav">

<button class="brand" onclick="go('home')">

<i class="logo">🌿</i>

<span style="color:#10221b">
IAN<span>GreenLink</span>
</span>

</button>

<nav class="links">

<button onclick="go('home')">Home</button>
<button onclick="go('learn')">Learn</button>
<button onclick="go('report')">Waste Report</button>
<button onclick="go('recycling')">Recycling</button>
<button onclick="go('activities')">Activities</button>
<button onclick="go('dashboard')">Dashboard</button>
<button onclick="go('announcements')">Announcements</button>
<button onclick="go('about')">About</button>

</nav>

<button class="hamb" onclick="toggle()">☰</button>

</div>

<div id="mobile" class="container mobile hide">

<button onclick="go('home')">Home</button>
<button onclick="go('learn')">Learn</button>
<button onclick="go('report')">Waste Report</button>
<button onclick="go('recycling')">Recycling</button>
<button onclick="go('activities')">Activities</button>
<button onclick="go('dashboard')">Dashboard</button>
<button onclick="go('announcements')">Announcements</button>
<button onclick="go('about')">About</button>
<button onclick="go('admin')">Administration</button>

</div>

</header>

<main id="app"></main>

<footer>

<div class="container foot">

<div>

<div class="brand">

<i class="logo">🌿</i>

<span style="color:#fff">
IAN<span>GreenLink</span>
</span>

</div>

<h2 style="font-size:28px;color:#fff;letter-spacing:-1px">
Connect. Act. Go Green.
</h2>

<p>
A Digital Waste Management and Environmental Conservation System.
</p>

</div>

<div>

<h3>Explore</h3>

<button onclick="go('learn')">Learn</button>
<button onclick="go('report')">Waste Report</button>
<button onclick="go('recycling')">Recycling</button>
<button onclick="go('activities')">Activities</button>

</div>

<div>

<h3>System</h3>

<button onclick="go('dashboard')">Dashboard</button>
<button onclick="go('announcements')">Announcements</button>
<button onclick="go('about')">About</button>
<button onclick="go('admin')">Administration</button>

</div>

<div>

<h3>Quick Action</h3>

<button onclick="go('report')">♻️ Report waste</button>
<button onclick="go('recycling')">🔎 Find a material</button>
<button onclick="go('activities')">🌱 Join an activity</button>

</div>

</div>

<div class="container bottom">

<span>© 2026 IAN GreenLink</span>

<span>
Built for sustainable development 🌱
</span>

</div>

</footer>

<div id="toast" class="toast"></div>

<div id="modal" class="modal">

<div id="modalbox" class="modalbox"></div>

</div>

<script>

const KEY="ianGreenLink";

const D={

reports:[
["Plastic bottles","Plastic","School compound",12],
["Paper waste","Paper","Classroom block",8],
["Food waste","Organic","Dining area",6],
["Plastic wrappers","Plastic","Playground",15],
["Cardboard","Paper","Store",5]
],

acts:[
[
"Clean-up the school compound",
"Collect litter and separate it into suitable waste categories.",
20
],
[
"Plastic-free day",
"Reduce single-use plastic for one day.",
15
],
[
"Plant and care for a tree",
"Plant or care for a suitable tree.",
25
],
[
"Waste separation challenge",
"Set up clearly labelled waste points.",
20
],
[
"Environmental awareness talk",
"Share one practical conservation message.",
10
]
],

students:[
["Student One","10B",45],
["Student Two","10B",30],
["Student Three","10B",20]
],

news:[
[
"Keep the school compound clean",
"Use the correct waste point and encourage others to keep shared spaces clean."
],
[
"Recycling awareness",
"Check the Recycling Guide before deciding how to handle a material."
]
]

};

let x=JSON.parse(localStorage.getItem(KEY)||"null")||{

reports:D.reports.map((r,i)=>({

id:i+1,
n:r[0],
c:r[1],
l:r[2],
q:r[3],
d:"2026-09-"+(17-i)

})),

acts:D.acts.map((a,i)=>({

id:i+1,
n:a[0],
d:a[1],
p:a[2],
done:false

})),

students:D.students.map((s,i)=>({

id:i+1,
n:s[0],
c:s[1],
p:s[2]

})),

news:D.news.map((n,i)=>({

t:n[0],
d:n[1],
date:"2026-09-"+(17-i)

}))

};

function save(){

localStorage.setItem(KEY,JSON.stringify(x));

}

function e(v){

return String(v??"").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

function toast(s){

let t=document.getElementById("toast");

t.textContent=s;

t.classList.add("show");

setTimeout(
()=>t.classList.remove("show"),
2300
);

}

function toggle(){

document
.getElementById("mobile")
.classList.toggle("hide");

}

function go(p){

document
.getElementById("mobile")
.classList.add("hide");

let f={
home,
learn,
report,
recycling,
activities,
dashboard,
announcements,
about,
admin
};

document.getElementById("app").innerHTML=
(f[p]||home)();

scrollTo(0,0);

if(p==="recycling")materials();

if(p==="dashboard")chart();

}

function shell(k,t,d,b){

return `

<section class="section">

<div class="container">

<div class="head">

<div class="kicker">${k}</div>

<h2>${t}</h2>

<p class="lead">${d}</p>

</div>

${b}

</div>

</section>

`;

}

/* HOME */

function home(){

return `

<section class="hero">

<div class="container">

<div class="badge">
● Sustainable Development
</div>

<h1>
BUILD A
<span>CLEANER</span>,
<br>
GREENER FUTURE.
</h1>

<p>
A digital platform that connects people with practical
solutions for waste management, recycling and
environmental conservation.
</p>

<div class="actions">

<button
class="btn primary"
onclick="go('report')">
Report Waste →
</button>

<button
class="btn secondary"
onclick="go('learn')">
Explore & Learn
</button>

</div>

</div>

</section>

${shell(
"IAN GREENLINK",
"One platform. Practical action.",
"Learn, report, track and take part in environmental activities from one simple digital space.",

`

<div class="grid g4">

${feat(
"♻️",
"Waste Reporting",
"Record waste information and help identify areas that need attention.",
"report"
)}

${feat(
"🔎",
"Smart Recycling",
"Search materials and learn responsible handling options.",
"recycling"
)}

${feat(
"🌱",
"Green Activities",
"Complete practical challenges and build your green record.",
"activities"
)}

${feat(
"📊",
"Environmental Dashboard",
"Turn activity and waste records into useful summaries.",
"dashboard"
)}

</div>

<div class="stats">

<div class="stat">
<strong>${x.reports.length}</strong>
<small>Waste reports</small>
</div>

<div class="stat">
<strong>${x.acts.filter(a=>a.done).length}</strong>
<small>Completed activities</small>
</div>

<div class="stat">
<strong>${x.students.length}</strong>
<small>Test students</small>
</div>

<div class="stat">
<strong>
${x.acts.filter(a=>a.done).reduce((s,a)=>s+a.p,0)}
</strong>
<small>Green points</small>
</div>

</div>

`
)}

`;

}

function feat(i,t,d,p){

return `

<article class="card">

<div class="icon">${i}</div>

<h3>${t}</h3>

<p>${d}</p>

<button
class="btn secondary"
style="margin-top:16px"
onclick="go('${p}')">
Open →
</button>

</article>

`;

}

/* LEARN */

function learn(){

let a=[

[
"🌍",
"Why waste matters",
"Good waste habits help protect shared spaces and natural resources."
],

[
"🗑️",
"Separate waste",
"Keeping suitable materials apart can make reuse, recovery and responsible disposal easier."
],

[
"💧",
"Protect water",
"Avoid dumping waste into drains, streams and other water sources."
],

[
"🌳",
"Protect green spaces",
"Care for trees, vegetation and clean public spaces."
],

[
"🔁",
"Reuse before disposal",
"Ask whether an item can be reused, repaired or repurposed before disposal."
],

[
"🤝",
"Lead by example",
"Environmental action becomes stronger when people share knowledge and participate together."
]

];

return shell(
"LEARN",
"Knowledge becomes <span>action.</span>",
"Explore simple environmental lessons designed to support practical habits.",

`

<div class="grid g3">

${a.map(v=>`

<article class="card">

<div class="icon">${v[0]}</div>

<h3>${v[1]}</h3>

<p>${v[2]}</p>

</article>

`).join("")}

</div>

<div class="panel" style="margin-top:22px">

<div
class="kicker"
style="color:#7de0a6">
GREENLINK PRINCIPLE
</div>

<h2 style="color:#fff">
Small actions can create visible change.
</h2>

<p>
Use learning together with reporting, recycling and activities
to turn knowledge into practical environmental participation.
</p>

<button
class="btn primary"
onclick="go('activities')">
Start a Green Activity →
</button>

</div>

`
);

}

/* WASTE REPORT */

function report(){

return shell(
"WASTE REPORT",
"Report <span>waste.</span> Support action.",
"Add a record that can be reviewed from the GreenLink dashboard.",

`

<div class="card" style="max-width:760px">

<form
class="form"
onsubmit="submitReport(event)">

<div>

<label>Waste item</label>

<input
id="rn"
required
placeholder="e.g. Plastic bottles">

</div>

<div>

<label>Category</label>

<select id="rc">

<option>Plastic</option>
<option>Paper</option>
<option>Organic</option>
<option>Glass</option>
<option>Metal</option>
<option>Electronic</option>
<option>Other</option>

</select>

</div>

<div>

<label>Location</label>

<input
id="rl"
required
placeholder="e.g. School compound">

</div>

<div>

<label>Quantity / count</label>

<input
id="rq"
type="number"
min="1"
value="1"
required>

</div>

<textarea
id="note"
placeholder="Optional note...">
</textarea>

<button class="btn primary">
Submit Waste Report →
</button>

</form>

</div>

<div style="margin-top:25px">

<h3>Recent reports</h3>

${reportTable()}

</div>

`
);

}

function reportTable(){

return `

<div class="tablewrap">

<table>

<thead>

<tr>

<th>Item</th>
<th>Category</th>
<th>Location</th>
<th>Qty</th>
<th>Date</th>

</tr>

</thead>

<tbody>

${x.reports
.slice()
.reverse()
.slice(0,8)
.map(r=>`

<tr>

<td>
<b>${e(r.n)}</b>
</td>

<td>
<span class="pill">
${e(r.c)}
</span>
</td>

<td>${e(r.l)}</td>

<td>${r.q}</td>

<td>${r.d}</td>

</tr>

`).join("")}

</tbody>

</table>

</div>

`;

}

function submitReport(ev){

ev.preventDefault();

x.reports.push({

id:Date.now(),

n:rn.value,

c:rc.value,

l:rl.value,

q:+rq.value,

d:new Date()
.toISOString()
.slice(0,10)

});

save();

toast("Waste report saved.");

go("dashboard");

}

/* RECYCLING */

const mats=[

[
"Plastic bottles",
"Recyclable",
"Empty and rinse where appropriate; place with suitable recyclable plastics."
],

[

function chart(){

let c=document.getElementById("chart");

if(!c)return;

let z=c.getContext("2d");

let cats=[
...new Set(
x.reports.map(r=>r.c)
)
];

let v=cats.map(k=>
x.reports
.filter(r=>r.c===k)
.reduce((s,r)=>s+r.q,0)
);

let mx=Math.max(...v,1);

let w=Math.min(
65,
(c.width-70)/cats.length-15
);

z.clearRect(
0,
0,
c.width,
c.height
);

cats.forEach((k,i)=>{

let xx=
50+i*((c.width-70)/cats.length);

let h=
v[i]/mx*205;

z.fillStyle="#18a957";

z.fillRect(
xx,
245-h,
w,
h
);

z.fillStyle="#52615b";

z.font="14px system-ui";

z.textAlign="center";

z.fillText(
k,
xx+w/2,
270
);

z.fillStyle="#12352a";

z.font="bold 15px system-ui";

z.fillText(
v[i],
xx+w/2,
235-h
);

});

}
